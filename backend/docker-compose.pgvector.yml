services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mysecondbrain-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: mysecondbrain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mysecondbrain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mysecondbrain"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysecondbrain_pgdata:
